<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenManus Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 18px;
            opacity: 0.95;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .card-content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .output-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #f0f0f0;
        }

        .output-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .output-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #333;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        .status-healthy {
            background: #4caf50;
            animation: pulse-green 2s infinite;
        }

        .status-loading {
            background: #ff9800;
            animation: pulse-orange 2s infinite;
        }

        .status-error {
            background: #f44336;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes pulse-orange {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .error {
            color: #f44336;
            margin-top: 10px;
        }

        .success {
            color: #4caf50;
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 36px;
            }

            .card-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 OpenManus</h1>
            <p>Open-Source Autonomous AI Agent</p>
        </div>

        <div class="card">
            <div class="card-content">
                <div class="status-text">
                    <span class="status-indicator status-healthy"></span>
                    <span id="status">Connecting...</span>
                </div>

                <form id="taskForm">
                    <div class="form-group">
                        <label for="prompt">Enter your task or prompt:</label>
                        <textarea
                            id="prompt"
                            placeholder="Example: Search for the latest AI news and summarize the top 3 headlines"
                            required
                        ></textarea>
                    </div>

                    <button type="submit" id="submitBtn">Execute Task</button>
                    <div id="error" class="error"></div>
                    <div id="success" class="success"></div>
                </form>

                <div class="output-section" id="outputSection" style="display: none;">
                    <div class="output-label">Output:</div>
                    <div class="output-box" id="output"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');
        const successEl = document.getElementById('success');
        const outputEl = document.getElementById('output');
        const outputSection = document.getElementById('outputSection');
        const submitBtn = document.getElementById('submitBtn');
        const taskForm = document.getElementById('taskForm');
        const promptInput = document.getElementById('prompt');

        // Check health on load
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    statusEl.textContent = 'Connected to OpenManus';
                    statusEl.parentElement.querySelector('.status-indicator').className = 'status-indicator status-healthy';
                    submitBtn.disabled = false;
                } else {
                    throw new Error('Server not responding');
                }
            } catch (error) {
                statusEl.textContent = 'Waiting for server...';
                statusEl.parentElement.querySelector('.status-indicator').className = 'status-indicator status-loading';
                setTimeout(checkHealth, 3000);
            }
        }

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        async function pollTask(taskId) {
            // Poll every 2s until the task finishes (completed or error).
            while (true) {
                const res = await fetch(`${API_BASE}/api/task/${taskId}`);
                if (!res.ok) throw new Error(`Status poll failed: ${res.status}`);
                const data = await res.json();
                if (data.status === 'completed' || data.status === 'error') {
                    return data;
                }
                await sleep(2000);
            }
        }

        // Handle form submission
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = promptInput.value.trim();

            if (!prompt) {
                errorEl.textContent = 'Please enter a prompt';
                return;
            }

            errorEl.textContent = '';
            successEl.textContent = '';
            outputEl.textContent = '';

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                const response = await fetch(`${API_BASE}/api/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const queued = await response.json();

                if (!response.ok || !queued.task_id) {
                    errorEl.textContent = queued.error || queued.detail || 'Error queuing task';
                    return;
                }

                outputSection.style.display = 'block';
                outputEl.textContent = `Task ${queued.task_id} queued. Running...`;

                const final = await pollTask(queued.task_id);
                if (final.status === 'completed') {
                    outputEl.textContent = final.result || 'Task completed successfully';
                    successEl.textContent = '✓ Task completed';
                } else {
                    errorEl.textContent = final.error || 'Task failed';
                }
            } catch (error) {
                errorEl.textContent = `Connection error: ${error.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Execute Task';
            }
        });

        // Initial health check
        checkHealth();
    </script>
</body>
</html>
